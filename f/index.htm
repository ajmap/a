<!DOCTYPE html>
<html>
<head>
<title>Toverspreuken</title>
<style>
          #s {
        background-color: black;
        width: 100vw;
        height: 100vh;
      }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-size: 3em;
  user-select: none; /* Prevent text selection */
}
  #wordDisplay { display: none; }
</style>
</head>
<body>
      <div id="s"></div>
<div id="wordDisplay"></div>

<script>
  


let s = document.getElementById("s");
       let wordDisplay = document.getElementById("wordDisplay");
            s.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        s.style.display = "none";
        wordDisplay.style.display = "block";
      });

const sentences = ["Schoonheid, liefde en geluk stromen mijn leven binnen als gouden rivieren, oneindig, overvloedig en gevuld met wonderen.", "Overvloed, vreugde en harmonie bloeien in mijn leven als duizenden bloemen in een prachtige lentetuin, kleurrijk, krachtig en vol levensenergie.", "Liefde omarmt mij als de warme zonnestralen op een zomerse ochtend, zacht, oneindig en gevuld met onvoorwaardelijke vreugde.", "Geluk en voorspoed stromen naar mij toe als de golven van een eindeloze oceaan, krachtig, moeiteloos en overvloedig.", "Wonderen ontvouwen zich in mijn leven als sterren aan een heldere nachthemel, schitterend, magisch en oneindig in hun schoonheid.", "Ik ontvang liefde, rijkdom en geluk als de aarde de zachte regen ontvangt, dankbaar, open en vol vertrouwen.", "Mijn leven vult zich met schoonheid en vreugde als een gouden zonsopkomst die de hele wereld verwarmt, stralend, krachtig en vol mogelijkheden.", "Overvloed stroomt door mijn leven als een machtige waterval, onuitputtelijk, sprankelend en vol gouden mogelijkheden.", "Vrede, liefde en dankbaarheid groeien in mijn hart als een eeuwenoude boom, diepgeworteld, krachtig en altijd bloeiend.", "Het leven schenkt mij prachtige verrassingen als de oceaan haar kostbaarste parels prijsgeeft, onverwacht, overvloedig en vol magie.", "Geluk, gezondheid en levensvreugde stromen door mijn lichaam en ziel als kristalhelder bronwater, zuiver, verfrissend en vol levenskracht.", "Ik trek wonderlijke kansen en prachtige ervaringen aan als bloemen de vlinders aantrekken, natuurlijk, moeiteloos en vol schoonheid.", "Rijkdom en voorspoed vinden hun weg naar mij als rivieren die samenkomen in een eindeloze zee, krachtig, vanzelfsprekend en overvloedig.", "Mijn hart is een oceaan van liefde waar geluk, zachtheid en vreugde als gouden golven doorheen bewegen, oneindig en onbegrensd.", "Elke dag brengt mij nieuwe zegeningen als de lente nieuw leven brengt op aarde, overvloedig, verrassend en vol prachtige mogelijkheden.", "Ik leef in een wereld vol liefde, schoonheid en wonderen, als een schitterende tuin waarin iedere droom de ruimte krijgt om te bloeien.", "Alles wat goed, mooi en liefdevol is, vindt moeiteloos zijn weg naar mij als licht dat door een open raam naar binnen stroomt.", "Mijn leven is gevuld met gouden kansen, diepe liefde en grenzeloze overvloed, als een prachtige rivier die nooit ophoudt met stromen.", "Vreugde, passie en inspiratie dansen door mijn leven als zonlicht dat schittert op het water, sprankelend, vrij en vol levensgeluk.", "Ik ontvang het mooiste wat het leven te bieden heeft als een oneindige oceaan haar schatten aan mij schenkt, met open armen, een dankbaar hart en grenzeloos vertrouwen.", "Ik ben een magneet voor liefde, schoonheid, geluk en overvloed. Alles wat mijn hart verwarmt en mijn ziel laat stralen, stroomt als een oneindige rivier mijn leven binnen. Ik ontvang, ik geniet, ik groei en ik bloei. Het leven is prachtig en ik sta volledig open voor al haar wonderen."];

          const rndm = Math.floor(Math.random() * sentences.length)          
const sentence = sentences[rndm];
let words = sentence.split(" ");
let currentWordIndex = words.length - 1;
let currentWord = words[currentWordIndex];
let currentLetterIndex = currentWord.length - 1;



function displayWord() {
  wordDisplay.textContent = currentWord;
}

function eraseLetter() {
  if (currentLetterIndex >= 0) {
    currentWord = currentWord.substring(0, currentLetterIndex);
    currentLetterIndex--;
    displayWord();
  } else {
    currentWordIndex--;
    if (currentWordIndex >= 0) {
      currentWord = words[currentWordIndex];
      currentLetterIndex = currentWord.length - 1;
      displayWord();
    } else {
      wordDisplay.textContent = "";
    }
  }
}

displayWord(); // Initial display


        let intervalId;
        let dynamicDelay = 500;
        
        function startDynamicInterval() {
          intervalId = setInterval(myFunction, dynamicDelay);
        }
        
        function myFunction() {
          eraseLetter();
        
          dynamicDelay += 50;
        
          clearInterval(intervalId);
          startDynamicInterval();
        }
        
        startDynamicInterval();          
</script>
</body>
</html>
