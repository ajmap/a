body {
  display: flex;

      <div id="s"></div>
<div id="wordDisplay"></div>

<script>
  


let s = document.getElementById("s");
       let wordDisplay = document.getElementById("wordDisplay");
            s.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        s.style.display = "none";
        wordDisplay.style.display = "block";
      });
          
const sentences = ["Ik ben omringd door een zee van liefde, licht en oneindige mogelijkheden, waarin mijn hart vrijuit mag dromen en mijn ziel volop mag stralen.", "Het leven ontvouwt zich voor mij als een prachtig kunstwerk, waarin iedere ervaring een kleur toevoegt en iedere nieuwe dag een schitterend meesterwerk mag worden.", "Ik trek schoonheid, harmonie en overvloed aan als een bloem die zich opent naar de warme stralen van de zon.", "Mijn leven is een wonderlijke reis vol magische ontmoetingen, onverwachte geschenken en momenten die mijn hart met diepe dankbaarheid vervullen.", "Ik ben als een stralende ster aan de hemel, omringd door oneindige liefde en geleid door het zachte licht van mijn innerlijke wijsheid.", "Iedere dag brengt nieuwe mogelijkheden op mijn pad, als kostbare parels die samen een schitterende ketting van geluk vormen.", "Ik leef in harmonie met het ritme van het universum en vertrouw erop dat alles zich op het juiste moment op de mooiste manier ontvouwt.", "Mijn hart is een onuitputtelijke bron van liefde, vreugde en zachtheid, waarvan de warme stroom alles om mij heen in schoonheid laat baden.", "Ik ontvang het leven met open armen en laat mij verrassen door de talloze wonderen die als schitterende vlinders mijn pad kruisen.", "Mijn dromen zijn als kostbare zaadjes in vruchtbare aarde; met liefde, vertrouwen en geduld groeien zij uit tot de mooiste werkelijkheid.", "Ik verdien een leven vol zachtheid, geluk en overvloed, waarin mijn hart zich veilig voelt en mijn ziel alle ruimte krijgt om te bloeien.", "Overal waar ik kijk, ontdek ik schoonheid; overal waar ik ga, ontmoet ik liefde en in alles wat ik beleef, vind ik redenen om dankbaar te zijn.", "Ik laat het licht van vreugde door mijn hele wezen stromen, als gouden zonnestralen die iedere verborgen hoek van mijn leven verlichten.", "Het universum schenkt mij iedere dag nieuwe zegeningen, als kleine wonderen die mijn levenspad met glans, warmte en magie versieren.", "Ik ben de schepper v in mijn hart als een eindeloze lentetuin, terwijl vrede mijn gedachten omarmt en geluk mijn levenspad verlicht.", "Ik trek prachtige kansen en bijzondere mogelijkheden aan, alsof het leven voortdurend nieuwe deuren voor mij opent naar een wereld vol wonderen.", "Mijn dagen zijn als kostbare parels aan een gouden ketting, gevuld met kleine geluksmomenten, warme verbindingen en onverwachte geschenken.", "Ik verdien een leven dat schittert van liefde, overvloed en vreugde, en ik open mijn armen om alles wat mooi is met dankbaarheid te ontvangen.", "Als een vlinder die vrij door een bloeiende tuin danst, beweeg ik mij licht en vol vertrouwen door het leven, wetend dat het mooiste nog voor mij ligt.", "Het geluk herkent mijn hart en vindt steeds opnieuw zijn weg naar mij, terwijl liefde mij omringt en overvloed zich op wonderlijke wijze vermenigvuldigt.", "Ik leef in harmonie met de schoonheid van het bestaan, waarin iedere ontmoeting een geschenk is, iedere ervaring een les en iedere dag een nieuwe belofte.", "Mijn levenspad is bezaaid met gouden kansen, liefdevolle verrassingen en schitterende mogelijkheden die mij dichter bij mijn mooiste dromen brengen.", "Ik ben omringd door een onzichtbare tuin van liefde en bescherming, waarin vertrouwen groeit, dankbaarheid bloeit en geluk iedere dag opnieuw wortel schiet.", "Alles wat bij mijn hoogste geluk hoort, vindt op het juiste moment zijn weg naar mij, als sterren die vanzelf aan een heldere hemel verschijnen.", "Ik omarm het leven met open armen en een dankbaar hart, wetend dat achter iedere horizon nieuwe schoonheid, liefde en betoverende mogelijkheden schuilgaan.", "Mijn leven ontvouwt zich als een sprookje vol gouden momenten, waarin ik liefde mag geven en ontvangen, mijn dromen werkelijkheid zie worden en iedere dag opnieuw de magie van het bestaan ervaar.", "Schoonheid, liefde en geluk stromen mijn leven binnen als gouden rivieren, oneindig, overvloedig en gevuld met wonderen. . .", "Overvloed, vreugde en harmonie bloeien in mijn leven als duizenden bloemen in een prachtige lentetuin, kleurrijk, krachtig en vol levensenergie. . .", "Liefde omarmt mij als de warme zonnestralen op een zomerse ochtend, zacht, oneindig en gevuld met onvoorwaardelijke vreugde. . .", "Geluk en voorspoed stromen naar mij toe als de golven van een eindeloze oceaan, krachtig, moeiteloos en overvloedig. . .", "Wonderen ontvouwen zich in mijn leven als sterren aan een heldere nachthemel, schitterend, magisch en oneindig in hun schoonheid. . .", "Ik ontvang liefde, rijkdom en geluk als de aarde de zachte regen ontvangt, dankbaar, open en vol vertrouwen. . .", "Mijn leven vult zich met schoonheid en vreugde als een gouden zonsopkomst die de hele wereld verwarmt, stralend, krachtig en vol mogelijkheden. . .", "Overvloed stroomt door mijn leven als een machtige waterval, onuitputtelijk, sprankelend en vol gouden mogelijkheden. . .", "Ik wandel door het leven als door een betoverende bloementuin, waarin liefde mij omarmt, geluk mij tegemoetkomt en iedere dag nieuwe wonderen voor mij in petto heeft. . .", "Het leven schenkt mij prachtige verrassingen als de oceaan haar kostbaarste parels prijsgeeft, onverwacht, overvloedig en vol magie. . .", "Geluk, gezondheid en levensvreugde stromen door mijn lichaam en ziel als kristalhelder bronwater, zuiver, verfrissend en vol levenskracht. . .", "Ik trek wonderlijke kansen en prachtige ervaringen aan als bloemen de vlinders aantrekken, natuurlijk, moeiteloos en vol schoonheid. . .", "Rijkdom en voorspoed vinden hun weg naar mij als rivieren die samenkomen in een eindeloze zee, krachtig, vanzelfsprekend en overvloedig. . .", "Mijn hart is een oceaan van liefde waar geluk, zachtheid en vreugde als gouden golven doorheen bewegen, oneindig en onbegrensd. . .", "Elke dag brengt mij nieuwe zegeningen als de lente nieuw leven brengt op aarde, overvloedig, verrassend en vol prachtige mogelijkheden. . .", "Ik leef in een wereld vol liefde, schoonheid en wonderen, als een schitterende tuin waarin iedere droom de ruimte krijgt om te bloeien. . .", "Alles wat goed, mooi en liefdevol is, vindt moeiteloos zijn weg naar mij als licht dat door een open raam naar binnen stroomt. . .", "Mijn leven is gevuld met gouden kansen, diepe liefde en grenzeloze overvloed, als een prachtige rivier die nooit ophoudt met stromen. . .", "Vreugde, passie en inspiratie dansen door mijn leven als zonlicht dat schittert op het water, sprankelend, vrij en vol levensgeluk. . .", "Ik ontvang het mooiste wat het leven te bieden heeft als een oneindige oceaan haar schatten aan mij schenkt, met open armen, een dankbaar hart en grenzeloos vertrouwen. . .", "Ik ben een magneet voor liefde, schoonheid, geluk en overvloed. . . Alles wat mijn hart verwarmt en mijn ziel laat stralen, stroomt als een oneindige rivier mijn leven binnen. . . Ik ontvang, ik geniet, ik groei en ik bloei. . . Het leven is prachtig en ik sta volledig open voor al haar wonderen. . ."];


          const rndm = Math.floor(Math.random() * sentences.length)          
const sentence = sentences[rndm];
let words = sentence.split(" ");
let currentWordIndex = words.length - 1;
let currentWord = words[currentWordIndex];
let currentLetterIndex = currentWord.length - 1;



function displayWord() {
  wordDisplay.textContent = currentWord;
}

function eraseLetter() {
  if (currentLetterIndex >= 0) {
    currentWord = currentWord.substring(0, currentLetterIndex);
    currentLetterIndex--;
    displayWord();
  } else {
    currentWordIndex--;
    if (currentWordIndex >= 0) {
      currentWord = words[currentWordIndex];
      currentLetterIndex = currentWord.length - 1;
      displayWord();
    } else {
      wordDisplay.textContent = "";
    }
  }
}

displayWord(); // Initial display


        let intervalId;
        let dynamicDelay = 500;
        
        function startDynamicInterval() {
          intervalId = setInterval(myFunction, dynamicDelay);
        }
        
        function myFunction() {
          eraseLetter();
        
          dynamicDelay += 50;
        
          clearInterval(intervalId);
          startDynamicInterval();
        }
        
        startDynamicInterval();          
</script>

</html>
