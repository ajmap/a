<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>White Circle Fade</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      position: relative;
      display: grid;
      place-items: center;
      background: #000;
      touch-action: manipulation;
    }
    button {
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    #start, #again {
      position: fixed;
      z-index: 2;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      padding: 15px 38px;
      font: 600 18px/1 system-ui, sans-serif;
    }
    #start {
      color: #000;
      background: #fff;
      border: 1px solid #fff;
    }
    #again {
      display: none;
      color: #fff;
      background: #000;
      border: 1px solid rgba(255,255,255,.8);
    }
    #again.show { display: block; }
    #circle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      display: none;
      will-change: width, height, opacity;
      pointer-events: none;
    }
    #circle.active { display: block; }
  </style>
</head>
<body>
  <button id="start" type="button">Start</button>
  <div id="circle" aria-hidden="true"></div>
  <button id="again" type="button">Again</button>

  <script>
    const startButton = document.getElementById('start');
    const againButton = document.getElementById('again');
    const circle = document.getElementById('circle');

    const DURATION = 120000; // 2 minutes
    const FADE_LAST_MS = 8000;
    let startedAt = 0;
    let frameId = 0;

    function screenCoveringDiameter() {
      // The circle starts slightly larger than the screen's diagonal,
      // so it covers the entire rectangular display at the beginning.
      return Math.hypot(window.innerWidth, window.innerHeight) * 1.03;
    }

    function animate(now) {
      const elapsed = Math.min(now - startedAt, DURATION);
      const progress = elapsed / DURATION;
      const diameter = screenCoveringDiameter() * (1 - progress);
      const fadeProgress = Math.max(0, (elapsed - (DURATION - FADE_LAST_MS)) / FADE_LAST_MS);

      circle.style.width = `${diameter}px`;
      circle.style.height = `${diameter}px`;
      circle.style.opacity = String(1 - fadeProgress);

      if (elapsed < DURATION) {
        frameId = requestAnimationFrame(animate);
      } else {
        circle.classList.remove('active');
        againButton.classList.add('show');
      }
    }

    async function start() {
      cancelAnimationFrame(frameId);
      startButton.style.display = 'none';
      againButton.classList.remove('show');
      circle.classList.add('active');
      circle.style.opacity = '1';
      circle.style.width = `${screenCoveringDiameter()}px`;
      circle.style.height = `${screenCoveringDiameter()}px`;

      // Fullscreen is requested directly from the tap, as required by browsers.
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (_) {
        // The animation still works if this browser does not permit fullscreen.
      }

      startedAt = performance.now();
      frameId = requestAnimationFrame(animate);
    }

    startButton.addEventListener('click', start);
    againButton.addEventListener('click', start);

    window.addEventListener('resize', () => {
      // Keep the starting circle large enough if the viewport changes.
      if (circle.classList.contains('active') && startedAt === 0) {
        const diameter = screenCoveringDiameter();
        circle.style.width = `${diameter}px`;
        circle.style.height = `${diameter}px`;
      }
    });
  </script>
</body>
</html>
